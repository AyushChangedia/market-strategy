name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # Deliberately not requirements.txt. The suite is offline, and installing
      # only what it genuinely needs keeps yfinance and matplotlib out — which
      # also proves the signal and evaluation layer still imports without them.
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy
          pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -q

  # The figures in the README are generated, not drawn. If either generator
  # breaks nobody finds out until someone tries to refresh the results, so
  # both run here against the committed inputs. This checks they execute; it
  # does not compare pixels.
  figures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install plotting dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy matplotlib pillow

      - name: Regenerate the charts from the committed results
        run: python make_charts.py

      - name: Regenerate the banner
        run: python make_banner.py --out /tmp/banner.png

      - name: Confirm every figure was written
        run: |
          set -euo pipefail
          for f in assets/returns.png assets/winrate.png assets/walkforward.png /tmp/banner.png; do
            [ -s "$f" ] || { echo "::error::$f missing or empty"; exit 1; }
          done
          echo "all figures generated"
